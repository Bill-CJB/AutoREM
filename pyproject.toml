[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autorem"
version = "1.0.0"
description = "Automated Reformulation of Robust Optimization via Memory-Augmented Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Jinbiao Chen"},
  {name = "Shuang Jin"},
  {name = "Guoyun Zhang"},
  {name = "Junyu Zhang"},
  {name = "Guanyi Wang"},
  {name = "Hanzhang Qin"},
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "gurobipy>=12,<14",
  "rsome==1.3.1",
  "tqdm>=4.67,<5",
]

[project.urls]
Repository = "https://github.com/Bill-CJB/AutoREM"

[project.scripts]
autorem = "autorem.__main__:main"

[tool.setuptools]
packages = ["autorem", "generation"]

[tool.setuptools.package-data]
generation = ["sources/*.json", "sources/netlib/*.mps", "sources/selection/*.dat"]
